<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Tracker</title>
    <!-- tailwind.css -->
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <!-- header section -->
    <header class="w-[80%] mx-auto">
        <h1 class="text-6xl font-bold text-green-500 py-10">Plant Tracker</h1>
        <div class="grid grid-cols-3 gap-8">
            <div class="bg-amber-200 p-4 rounded-lg">
                <p>Total</p>
                <p id="total">0</p>
            </div>
            <div class="bg-green-200 p-4 rounded-lg">
                <p>Thrive</p>
                <p id="thrive-count">0</p>
            </div>
            <div class="bg-red-200 p-4 rounded-lg">
                <p>Struggling</p>
                <p id="struggling-count">0</p>
            </div>
        </div>
    </header>

    <hr class="my-8">

    <main class="w-[80%] mx-auto">
        <!-- btn section -->
        <div class="flex gap-8">
            <button class="bg-black text-white px-5 py-2 rounded-lg" id="all-filter-btn">All</button>
            <button class="bg-gray-300 px-5 py-2 rounded-lg" id="thriving-filter-btn">Thriving</button>
            <button class="bg-gray-300 px-5 py-2 rounded-lg" id="struggling-filter-btn">Struggling</button>
        </div>

        <!-- card section -->
         <section id="allCard">
            <!-- card -->
             <div class="flex justify-between my-10 border p-8 rounded-lg">
                <!-- main part -->
                <div class="space-y-6">
                    <div>
                        <P  class="plantName">Plant Name</P>
                        <p class="lastName">Latin Name</p>
                    </div>
                    <div class="flex gap-5">
                        <p class="light bg-gray-200 px-5 py-2 rounded">Bright Indicate</p>
                        <p class="water bg-gray-200 px-5 py-2 rounded">Weekly</p>
                    </div>
                    <p class="status font-bold">Not applicable</p>
                    <p class="notes text-gray-500">Now leaf unfurling by the east window.</p>
                    <div class="flex gap-8">
                        <button class="thriving-btn bg-green-200 px-4 py-2 rounded-lg">Thrive</button>
                        <button class="struggling-btn bg-red-200 px-4 py-2 rounded-lg">Struggle</button>
                    </div>
                </div>
                <!-- btn part -->
                <div>
                    <button class="btn-delete bg-red-200 text-red-500 px-4 py-2 rounded-lg">Delete</button>
                </div>
             </div>

         </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
