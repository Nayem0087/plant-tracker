<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Tracker</title>
    <!-- tailwind.css -->
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <header class="w-[80%] mx-auto">
        <h1 class="text-6xl font-bold text-green-500 py-10">Plant Tracker</h1>
        <div class="grid grid-cols-3 gap-8">
            <div class="bg-amber-200 p-4 rounded-lg">
                <p>Total</p>
                <p id="total">0</p>
            </div>
            <div class="bg-green-200 p-4 rounded-lg">
                <p>Thrive</p>
                <p id="thrive-count">0</p>
            </div>
            <div class="bg-red-200 p-4 rounded-lg">
                <p>Struggling</p>
                <p id="struggling-count">0</p>
            </div>
        </div>
    </header>

    <script src="js/script.js"></script>
</body>
</html>
